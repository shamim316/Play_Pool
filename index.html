<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#101418" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎱</text></svg>" />
  <title>Play Pool</title>
</head>
<body>
  <div id="app">
    <canvas id="canvas"></canvas>

    <div id="hud" class="hidden">
      <div id="p0" class="player">
        <span class="pname">You</span>
        <span class="pgroup"></span>
        <span class="pballs"></span>
      </div>
      <div id="turnMsg"></div>
      <div id="p1" class="player">
        <span class="pballs"></span>
        <span class="pgroup"></span>
        <span class="pname">Computer</span>
      </div>
    </div>

    <div id="toast" class="hidden"></div>

    <div id="powerWrap" class="hidden">
      <div id="powerTrack"><div id="powerFill"></div></div>
      <div id="powerLabel">PULL ▼<br>&amp; RELEASE</div>
    </div>

    <div id="spinWidget" class="hidden">
      <div id="spinBall"><div id="spinDot"></div></div>
      <div id="spinLabel">SPIN</div>
    </div>

    <button id="btnMenu" class="hidden" title="Main menu">☰</button>
    <button id="btnSound" class="hidden" title="Sound on/off">🔊</button>

    <div id="menu" class="overlay">
      <h1>Play Pool</h1>
      <p class="tag">Classic billiards against the computer</p>
      <div class="modes">
        <button class="mode selected" data-mode="8ball"><b>8-Ball</b><span>Solids vs stripes</span></button>
        <button class="mode disabled" disabled><b>9-Ball</b><span>Coming soon</span></button>
        <button class="mode disabled" disabled><b>Straight Pool</b><span>Coming soon</span></button>
      </div>
      <div class="diff">
        <button data-d="easy">Easy</button>
        <button data-d="medium" class="selected">Medium</button>
        <button data-d="hard">Hard</button>
      </div>
      <button id="btnPlay">PLAY</button>
      <button id="btnStats" class="ghost">📊 My stats</button>
      <p id="menuAccount"></p>
      <p id="menuStats"></p>
      <p class="hint">Aim: tap or drag on the table &nbsp;·&nbsp; Shoot: pull the golden power bar all the way down, then let go</p>
    </div>

    <div id="result" class="overlay hidden">
      <h1 id="resTitle"></h1>
      <p id="resReason"></p>
      <div id="resStats"></div>
      <div id="resAch" class="hidden"></div>
      <div id="resSave">
        <button id="btnGoogle" class="hidden">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.5 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.3 6.9-17.7z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.3 0 11.6-2.1 15.5-5.7l-7.7-6c-2.1 1.4-4.8 2.3-7.8 2.3-6.3 0-11.6-4-13.5-9.9l-7.9 6.2C6.5 42.6 14.6 48 24 48z"/></svg>
          Sign in with Google to save your progress
        </button>
        <p id="resSaveNote" class="note"></p>
      </div>
      <div id="resSuggest" class="hidden">
        <span id="resSuggestText"></span>
        <button id="btnSuggest"></button>
      </div>
      <div class="row">
        <button id="btnAgain">Play again</button>
        <button id="btnToMenu">Main menu</button>
      </div>
    </div>

    <div id="statsPanel" class="overlay scroll hidden">
      <h2>📊 Your stats</h2>
      <p id="statsAccount"></p>
      <div id="statsTable"></div>
      <h3>Achievements</h3>
      <div id="achGrid"></div>
      <h3>Leaderboard</h3>
      <div id="lbList"></div>
      <div class="row">
        <button id="btnCloseStats">Back</button>
        <button id="btnSignOut" class="hidden">Sign out</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
